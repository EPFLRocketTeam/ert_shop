# Full ERT shop stack: Postgres + Redis + Medusa (server & worker) + storefront.
#
# Local:   cp .env.example .env  (fill it in)  &&  docker compose up -d --build
#          -> first start: migrations + seed run automatically, the storefront
#             waits for the backend, then builds itself (takes 1-3 minutes).
# Dokploy: create a "Compose" service pointing at this repo, paste the same
#          variables into its Environment tab, and attach domains to
#          medusa-server (e.g. api.shop.epflrocketteam.ch, port 9000) and
#          storefront (shop.epflrocketteam.ch, port 8000).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ert_medusa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ert_shop}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ert_medusa}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  medusa-server:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: &medusa-env
      DATABASE_URL: postgres://${POSTGRES_USER:-ert_medusa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ert_shop}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET}
      STORE_CORS: ${STORE_CORS:-http://localhost:8000}
      ADMIN_CORS: ${ADMIN_CORS:-http://localhost:9000}
      AUTH_CORS: ${AUTH_CORS:-http://localhost:9000}
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-http://localhost:9000}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      MEDUSA_WORKER_MODE: server
      DISABLE_MEDUSA_ADMIN: "false"
      # the seed writes the publishable key here for the storefront
      PUBLISHABLE_KEY_FILE: /shared/publishable-key
      # optional: first admin user, created on start if set
      MEDUSA_ADMIN_EMAIL: ${MEDUSA_ADMIN_EMAIL:-}
      MEDUSA_ADMIN_PASSWORD: ${MEDUSA_ADMIN_PASSWORD:-}
    volumes:
      - shared:/shared
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health || exit 1"]
      interval: 10s
      start_period: 300s
      retries: 10
    # Bound to 127.0.0.1 only: reachable at localhost:9000 on your machine, but
    # NOT from the internet on the server - there the public traffic goes
    # through Dokploy's Traefik (HTTPS) via the domain set in the Dokploy UI.
    ports:
      - "127.0.0.1:9000:9000"

  medusa-worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      # wait until the server has finished running migrations
      medusa-server: { condition: service_healthy }
    environment:
      <<: *medusa-env
      MEDUSA_WORKER_MODE: worker
      DISABLE_MEDUSA_ADMIN: "true"
      PUBLISHABLE_KEY_FILE: ""

  storefront:
    build: ./storefront
    restart: unless-stopped
    depends_on:
      medusa-server: { condition: service_healthy }
    environment:
      # the storefront talks to the backend server-side only, so it can use
      # the internal docker network address
      MEDUSA_BACKEND_URL: http://medusa-server:9000
      # leave empty to pick it up automatically from the backend (shared volume)
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-}
      PUBLISHABLE_KEY_FILE: /shared/publishable-key
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_DEFAULT_REGION: ch
      NEXT_PUBLIC_STRIPE_KEY: ${NEXT_PUBLIC_STRIPE_KEY:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-supersecret}
    volumes:
      - shared:/shared:ro
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
  redisdata:
  shared:
